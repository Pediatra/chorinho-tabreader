# Mapa símbolo -> significado, POR CANAL (decisão de projeto: símbolo não se descarta, o
# significado é dado depois, olhando imagem). Fonte: dono do projeto, leitura da folha
# `data/saida/frames/folha_simbolos_1.png` em 2026-10-09, comparada com a minha leitura
# independente — 48/48 de concordância em "é algarismo?", e 16/16 no algarismo E no valor.
#
# Ele separou o que eu havia juntado, e isso virou a taxonomia do gabarito:
#   &   = recorte nada a ver (pedaço cinza)
#   §   = pedaço DA TABLATURA (material de linha: corda, barline, cruz barline x corda)
#   {}  = pedaço DA PARTITURA
#   (n) = algarismo entre parênteses (nota presa)

versao: 1
atualizado: 2026-10-09

taxonomia_de_recorte:
  algarismo: "algarismo de casa, legível — vira NOTA, nunca símbolo"
  nada: "recorte sem relação: pedaço cinza, foto borrada, fundo (&)"
  tablatura: "material de linha da tablatura: corda, barline, e a CRUZ de barline x corda (§)"
  partitura: "pedaço da pauta de 5 linhas / notação ({}) — NÃO pode entrar na coleta"
  simbolo: "marca de técnica ou ligadura — é o que interessa classificar"

simbolos:
  "(n)":
    nome: nota_presa
    aspecto: "algarismo dentro de parênteses, ex.: (0), (3), (12)"
    significado_oficial: >
      A nota NÃO deve ser tocada de novo: ela continua soando. O dono do projeto listou os
      três usos que dependem do contexto — (a) nota ligada (tie/sustentação): foi tocada
      antes e continua soando, sem nova palhetada; (b) nota fantasma ou toque suave: nota
      abafada, muito fraca ou sutil, em passagens rápidas; (c) resultado de técnica: aparece
      depois de bend (7b(9)) ou de hammer-on/pull-off (2h(4)), indicando a nota de chegada,
      que soa sem nova palhetada.
    fonte: dono_do_projeto
    confirmado: true
    onde: "visto em mr. tabs (recorte 40 da folha de simbolos)"
  "(-":
    nome: abertura_de_parentese_com_linha
    aspecto: "abertura de parêntese com uma linha da tablatura atravessando"
    significado_oficial: null
    fonte: dono_do_projeto
    confirmado: false
    onde: "mr. tabs (recorte 47)"
  pedaco_de_arco:
    nome: fragmento_de_ligadura
    aspecto: "pedaço de arco cortado, sem as pontas"
    significado_oficial: null
    fonte: dono_do_projeto
    confirmado: false
    onde: "shin izumi (recorte 19)"

# O que a leitura do dono revelou sobre a COLETA (não sobre o símbolo):
achados_da_auditoria:
  - "8% da amostra (4 de 48) ainda é PEDAÇO DE PARTITURA: o delimitador não a exclui em todos os painéis"
  - "25% (12 de 48) é material de linha da tablatura, incluindo as 5 CRUZES (barline x corda) que cabem na caixa e escapam das regras de tamanho"
  - "33% (16 de 48) era algarismo puro guardado como símbolo — o alvo do discriminador"

# ---------------------------------------------------------------------------
# Vocabulário observado POR CANAL (o que já apareceu nas duas folhas lidas no olho).
# Isto é COBERTURA, não significado: a coluna `significado_oficial` só recebe valor quando o
# dono do projeto confirma. Símbolo sem significado é dívida declarada, não erro.
vocabulario_por_canal:
  mr. tabs:
    visto:
      - "(n)  algarismo entre parênteses — nota presa (CONFIRMADO pelo dono)"
      - "(-  abertura de parêntese com uma linha da tablatura atravessando"
    lixo_dominante: "hastes de barline e pedaços de corda (§)"
  shin izumi:
    visto:
      - "fragmento de arco (ligadura cortada, sem as pontas)"
      - "diagonal — candidato a slide (não confirmado)"
      - "rabisco vertical (não identificado)"
    lixo_dominante: "hastes, fotos borradas e algarismos (§ e &)"
  tv on guitar:
    visto: ["nada de símbolo identificado nas duas folhas"]
    lixo_dominante: "algarismos guardados como símbolo (o maior foco de falso símbolo medido)"
  violaodecria:
    visto: ["nada de símbolo identificado"]
    lixo_dominante: "nomes de acorde em TEXTO e fotos (não é tablatura)"
  cifra club:
    visto: ["nada de símbolo identificado"]
    lixo_dominante: "gradiente de fundo e pedaços de corda"
  # Os demais canais apareceram nas folhas com algarismo e/ou lixo; símbolo ainda não.

# O que o mapa ainda NÃO tem, dito sem rodeio:
# - sigla de canal com vocabulário próprio mapeado: 1 (mr. tabs, e só um símbolo);
# - canais amostrados com algum símbolo visto: 2 (mr. tabs, shin izumi);
# - canais amostrados sem nenhum símbolo identificado: 15.
# Conclusão: o vocabulário por canal está no COMEÇO. Símbolo de verdade é ~2% da coleta, e a
# coleta precisa parar de guardar lixo antes de valer a pena ampliar a leitura.

# ---------------------------------------------------------------------------
# VOCABULÁRIO E REGRAS DO DONO DO PROJETO — 46 marcas em 6 tablaturas (2026-10-09),
# feitas com a ferramenta de clicar (data/saida/paineis/marcar.html). Regra dele, explícita:
#   "tudo que eu marquei é símbolo válido e o que eu não marquei não é símbolo válido"
# => isto é um conjunto COMPLETAMENTE ROTULADO: 46 positivos e 417 negativos medidos.
# Verdade bruta em data/gold/simbolos_marcados.json (com o texto dele por marca).
#
# O que ele nomeou, por frequência medida:
#   arco_ligadura      24   (mr. tabs 8, shin izumi 11, serge kottelat 3, pablo romé 1, tv on guitar 1)
#   arco_slide         15   (tv on guitar 10, mr. tabs 2, serge kottelat 2, pablo romé 1)
#   arpejo_vertical     3   (tv on guitar 2, kimny's guitar 1)
#   formula_compasso    2   (kimny's guitar 2: 3/4 e 4/4)
#   pausa               2   (shin izumi 2: pausa de colcheia)
#
regras_do_dono:
  arco_de_ligadura:
    nome: ligadura
    como_reconhecer: "arco (linha curva) ligando dois algarismos, em geral na MESMA corda"
    regra_h_vs_p: >
      A direção dos NÚMEROS decide a técnica: 7 -> 10 (subindo) é HAMMER-ON; 10 -> 7 (descendo)
      é PULL-OFF. Regra dada explicitamente pelo dono: "10 - 7 diminuindo então é um pull off,
      se fosse 7 - 10 seria um hammer on".
    regra_da_direcao_do_arco: "arco para baixo ou para cima tem o MESMO significado"
    confirmado: true
  arco_com_barra_no_meio:
    nome: slide
    regra: >
      "é um arco de ligadura, mas tem outra regra: quando tem uma barra no meio não é mais
      pull off ou hammer on, é um SLIDE."
    confirmado: true
  algarismo_em_parenteses:
    nome: nota_presa
    regra: >
      "(9)" = a nota NÃO é tocada de novo: toca o primeiro 9 e deixa soar pelo tempo marcado. Os
      parênteses reforçam que é prolongamento da nota anterior.
    confirmado: true
  ligadura_de_prolongamento:
    nome: prolongamento
    regra: >
      Símbolo diferente de hammer-on/pull-off: quando o grupo seguinte tem notas iguais às que já
      estão soando, elas CONTINUAM ressoando e só se ataca a nota nova que entra. Ex.: dois 5
      ligados continuam a soar enquanto se ataca o 5 da 2ª corda.
    confirmado: true
  ornamento_ondulado:
    nome: apoyatura_com_slide
    regra: >
      "Os símbolos ondulados ao lado do 3 (e do 2) indicam ornamentação — apoyatura/grace note com
      slide: toca-se ou desliza-se muito rápido para a casa vizinha logo antes do tempo principal."
    confirmado: true
  arpejo_vertical:
    nome: arpejo
    regra: >
      Uma linha vertical que ocupa N cordas significa arpejo dessas N cordas, de cima para baixo:
      "ocupa 3 cordas = 3 cordas tocadas para baixo, significa arpejo"; "ocupa todas as 6 cordas na
      vertical = arpejo de cima para baixo".
    confirmado: true
  pausa_de_colcheia:
    nome: pausa
    regra: "silêncio com a duração de meio tempo em 4/4: interrompe a sonoridade e pausa antes da nota seguinte."
    confirmado: true
  formula_de_compasso:
    nome: metrica
    regra: "indica a métrica (3/4, 4/4). NÃO é técnica: é notação de tempo."
    confirmado: true

# REGRA ÚNICA DO ARCO, dada pelo dono em 2026-10-15 (conferência T8.2). O arco pode estar
# virado para cima ou para baixo; o que decide são os NÚMEROS dentro dele.
regra_do_arco_pelos_numeros:
  dois_numeros_iguais: prolongamento   # ligadura de prolongamento
  um_numero_e_vazio_do_outro_lado: prolongamento   # também é ligadura válida
  primeiro_maior_segundo_menor: pull_off
  primeiro_menor_segundo_maior: hammer_on
  tres_ou_mais_numeros: mordente   # vários h/p dentro do mesmo arco
  barra_entre_os_numeros: slide    # o slide às vezes vem SEM arco; o arco não é a regra
  outros_simbolos_citados: [arpejo de 2 a 6 cordas, ritornelo, harmonico, rasgueado]
  aviso_de_recorte: >
    Há tablaturas em que o arco da corda 1 fica acima da linha e o recorte corta a parte de
    cima: o arco some. Ampliar o recorte um pouco para cima da corda 1.
  confirmado: true

# IMPORTANTE para o coletor: 3 destes símbolos NÃO são de técnica e sim de NOTAÇÃO —
# fórmula de compasso e pausa. Se o objetivo é técnica por nota, eles devem ser guardados
# separados (e não como símbolo da nota).

# ---------------------------------------------------------------------------
# TIPOS NOVOS das 78 marcas da 2ª rodada (2026-10-09). O conjunto passou de 46 para 123
# positivos e de 6 para 8 canais; estes três tipos NÃO existiam antes.
tipos_da_segunda_rodada:
  setas_de_palhetada:
    nome: direção de palhetada / rasgueado
    n_marcas: 22
    aspecto: "seta (para cima ou para baixo) sobre 1 ou 2 cordas"
    regra_do_dono: >
      "Essas setas indicam a direção da palhetada ou do rasgueado (strumming). A seta apontada
      para baixo significa palhetar de cima para baixo." Ocupa 1 ou 2 cordas.
    porque_importa: "é técnica de MÃO DIREITA: muda a execução, não a altura da nota"
    confirmado: true
  ligadura_de_prolongamento_longa:
    nome: sustentação longa
    n_marcas: 12
    regra_do_dono: >
      "É a continuação do mesmo conceito, mas prolongado ao longo de vários tempos e compassos.
      Tocas na 9ª casa uma única vez no início e sustentas o som."
    diferenca: "a ligadura curta dura um tempo; esta atravessa compassos — o dado por nota precisa
      guardar a DURAÇÃO, senão a nota parece reaparecer"
    confirmado: true
  arco_de_ligadura_com_slide_embaixo:
    nome: ligadura com slide descendente
    n_marcas: 6
    regra_do_dono: "arco de ligadura com slide em baixo"
    confirmado: true

# AVISO DE MEDIÇÃO do dono (5 marcas), que é sobre o MEU recorte e não sobre o símbolo:
aviso_de_medicao:
  arco_quase_sumindo:
    texto_do_dono: "arco de ligadura quase sumindo — cuidado pra não cortar coisa demais"
    consequencia: >
      Arco de BAIXO CONTRASTE é justamente o que uma janela de recorte apertada perde. Se a
      janela de 1,6 × passo estiver cortando esses arcos, o detector aprende a não vê-los e o erro
      só aparece depois, na transcrição. Medir antes de confiar.

# ---------------------------------------------------------------------------
# VOCABULÁRIO COMPLETO — 241 marcas do dono em 37 tablaturas (3 arquivos).
# MÉTODO CORRIGIDO POR ELE: ler TODOS os significados distintos, nunca só os mais frequentes.
# Com `most_common` eu perdi `mordente` (1 marca no arquivo anterior), bend, trémolo e ritornello.
# Frequência não é importância.
vocabulario_completo:
  arco_de_ligadura:
    texto_do_dono: "arco de ligadura (43 marcas)"
    regra_h_vs_p: "10 -> 7 (descendo) é PULL-OFF; 7 -> 10 (subindo) é HAMMER-ON"
    direcao_do_arco: "para cima ou para baixo tem o MESMO significado"
  arco_com_barra_no_meio:
    nome: slide
    texto_do_dono: "não é mais pull off ou hammer on, é um slide"
  mordente:
    texto_do_dono: "quando um arco cobre três ou mais notas chama-se tecnicamente mordente — ornamento rápido num único tempo"
    nota: "EU JA TINHA ESSE DADO e não vi, porque resumi por frequência (1 marca em T14_serge)"
  bend_ou_ligadura_de_expressao:
    texto_do_dono: "linha curva flutuante por cima do número 10 indica ligadura de expressão (legato) ou bend"
  tremolo:
    texto_do_dono: "3 traços inclinados por baixo do acorde = trémolo (tremolo picking)"
  slide_in:
    texto_do_dono: "slide ascendente de entrada (slide-in): pequena linha subindo até a nota"
  slide_out:
    texto_do_dono: "slide descendente de saída (slide-out / slide off)"
  ligadura_de_prolongamento:
    curta: "mesma nota sustentada por um tempo"
    longa: "prolongado ao longo de vários tempos e compassos — o dado por nota tem de guardar a DURAÇÃO"
  nota_presa_entre_parenteses:
    texto_do_dono: "(4) pull-off ligado a uma nota que JÁ VEM RESSOANDO; (9) = não tocar de novo, deixar soar"
  pull_off_de_nota_ressonante:
    texto_do_dono: "toca a nota anterior e, sem palhetar, soa a de chegada"
  ornamento_ondulado:
    texto_do_dono: "símbolos ondulados ao lado do 3 (e do 2) = apoyatura / grace note com slide"
  setas_de_palhetada:
    texto_do_dono: "indicam a direção da palhetada ou do rasgueado; 'seta longa' atravessa o acorde (varrido/arpejo rápido); ocupa 1, 2 ou mais cordas"
  arpejo_vertical:
    texto_do_dono: "linha vertical sobre N cordas = arpejo dessas N cordas, de cima para baixo"
  notas_abafadas:
    nome: muted notes
    texto_do_dono: "manter os dedos da mão esquerda apenas encostados nas cordas, sem apertar contra os trastes"
  algarismo_pequeno:
    texto_do_dono: "quando o número fica pequeno: essa casa deve ser tocada de forma quase instantânea (grace note)"
  # NOTAÇÃO (não é técnica — guardar SEPARADO do símbolo da nota):
  pausas:
    tipos: "colcheia, semínima, mínima pontuada, semibreve"
    texto_do_dono: "indica silêncio com a duração exata; interrompe a sonoridade das cordas"
  formula_de_compasso:
    texto_do_dono: "3/4 e 4/4 — métrica, não técnica"
  barra_de_repeticao:
    nome: ritornello
    texto_do_dono: "barra de repetição de fechamento / ritornello duplo (linhas com pontos dos dois lados)"
  # O QUE NÃO É SÍMBOLO (instrução explícita dele):
  nao_e_simbolo:
    rotulo_tab: "T A B não é símbolo nenhum — é texto de alguns canais, fica na vertical ocupando as cordas. NÃO confundir com símbolo."
    aula_ignorada: "T06 tv cifras — 'AULA FILTREI ERRADO, JA FOI APAGADO E CORRIGIDO IGNORE ESSA AULA E TABLATURA'"

# ---------------------------------------------------------------------------
# TIPOS DO C-SET — 200 marcas em 22 tablaturas, feitas sobre os VÍDEOS QUE A COLETA USA.
# Ele mandou com a ordem "leia tudo, não me engane novamente": a lista abaixo saiu da leitura
# COMPLETA dos significados, sem resumo por frequência (foi o resumo que me fez perder o mordente).
tipos_do_cset:
  vibrato:
    texto_do_dono: "o símbolo ~ ao lado do número: oscilar ligeiramente a altura da nota depois de a tocar"
    n_marcas: 3
  appoggiatura_grace_note:
    texto_do_dono: "a 14ª casa pequenina é uma appoggiatura: toca-se de forma instantânea e faz-se um hammer-on rápido para a 15ª"
    marca_visual: "ALGARISMO PEQUENO"
    n_marcas: 5
  notas_fantasma_em_parenteses:
    texto_do_dono: "notas entre parênteses (7): notas fantasma ou sustentadas que continuam a ressoar em segundo plano; NÃO voltar a palhetar"
    n_marcas: 4
  harmonico_natural_em_bloco:
    texto_do_dono: "oval (ou círculo) a envolver todo o acorde = harmónico natural em bloco / harmónico de toque"
    n_marcas: 3
  harmonico_entre_angulos:
    texto_do_dono: "harmónico (número com < >) em volta; ocorre onde a corda é dividida numa fração exata (12ª casa = 1/2 da corda)"
    n_marcas: 1
  slide_off:
    n_marcas: 3
  pausa_de_seminima:
    texto_do_dono: 'símbolos que parecem "Z" ou "3" estilizados = pausas de semínima (1 tempo cada)'
    nota: "NOTAÇÃO, não técnica"
    n_marcas: 12
  compasso_5_4:
    texto_do_dono: "COMPASSO DA MUSICA 5/4"
    nota: "NOTAÇÃO (métrica), não técnica"
    n_marcas: 4
  h_hammer_on:
    texto_do_dono: "h -> hammer on (escrito por extenso na tablatura)"
    n_marcas: 2
  ligadura_de_sustentacao_cruzando_compasso:
    texto_do_dono: 'arcos grandes que saem do fim do compasso 67 e entram no 68, sobre os números entre parênteses (0), (2), (3): o acorde CONTINUA a ressoar'
    n_marcas: 12
  cordas_abafadas_2:
    texto_do_dono: "cordas abafadas"
    n_marcas: 4

# O que ELE nomeou como NÃO símbolo (negativos, 31 marcas) — e é ouro, porque é ele apontando:
nao_e_simbolo_2:
  traco_a_ser_ignorado:
    texto_do_dono: "traço a ser ignorado"
    n_marcas: 24
  tab_texto:
