<!doctype html>
<meta charset="utf-8">
<title>Marcar simbolos na tablatura</title>
<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#1b1b1b;color:#eee}
 header{position:sticky;top:0;background:#111;padding:8px 12px;border-bottom:1px solid #333;z-index:5}
 #rot{font-weight:600}
 #barra{margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
 button{background:#333;color:#eee;border:1px solid #555;border-radius:4px;padding:4px 10px;cursor:pointer}
 button:hover{background:#444}
 #palco{position:relative;overflow:auto;height:60vh;background:#000;margin:8px 0}
 canvas{display:block;image-rendering:pixelated}
 #lista{max-height:30vh;overflow:auto;font-size:13px;padding:0 12px}
 .m{display:flex;gap:6px;align-items:center;margin:3px 0}
 .m b{color:#ff6b6b;width:22px;text-align:right}
 .m code{color:#8ec07c;width:110px}
 .m input{flex:1;background:#222;color:#eee;border:1px solid #555;border-radius:3px;padding:3px 6px}
 .m button{padding:2px 6px}
 small{color:#aaa}
</style>
<header>
 <div id="rot"></div>
 <div id="barra">
  <button onclick="va(-1)">◀ anterior</button>
  <button onclick="va(1)">próxima ▶</button>
  <button onclick="zoom(-0.25)">− zoom</button>
  <button onclick="zoom(0.25)">+ zoom</button>
  <span id="z">100%</span>
  <button onclick="limpar()">limpar marcas desta imagem</button>
  <button onclick="salvar()"><b>salvar JSON</b></button>
  <label style="font-size:12px">continuar de marcas anteriores: <input type="file" id="carregar" accept=".json"></label>
  <span id="cont"></span>
 </div>
 <small>Clique em cima do símbolo. Cada clique vira um número no desenho; escreva o significado na lista abaixo. Troque de imagem quando terminar — as marcas ficam guardadas.</small>
</header>
<div id="palco"><canvas id="cv"></canvas></div>
<div id="lista"></div>

t=0.65 | passo=15.0px"}, {"arq": "C16_shin izumi.png", "canal": "shin izumi", "video": "shin izumi/【tab】beauty and the beast - 美女と野獣 - disney - fingerstyle guitar  ソロギター【タブ】.mp4", "frac": 0.65, "passo": 21.4, "rotulo": "C16. shin izumi | shin izumi/【tab】beauty and the bea | t=0.65 | passo=21.4px"}, {"arq": "C17_shin izumi.png", "canal": "shin izumi", "video": "shin izumi/【tab】beauty and the beast - 美女と野獣 - disney - fingerstyle guitar  ソロギター【タブ】.mp4", "frac": 0.85, "passo": 21.8, "rotulo": "C17. shin izumi | shin izumi/【tab】beauty and the bea | t=0.85 | passo=21.8px"}, {"arq": "C18_sky guitar.png", "canal": "sky guitar", "video": "sky guitar/ghostbusters - fingerstyle lesson + tab.mp4", "frac": 0.65, "passo": 24.4, "rotulo": "C18. sky guitar | sky guitar/ghostbusters - fingerst | t=0.65 | passo=24.4px"}, {"arq": "C19_sky guitar.png", "canal": "sky guitar", "video": "sky guitar/ghostbusters - fingerstyle lesson + tab.mp4", "frac": 0.85, "passo": 24.4, "rotulo": "C19. sky guitar | sky guitar/ghostbusters - fingerst | t=0.85 | passo=24.4px"}, {"arq": "C20_transcriptor.png", "canal": "transcriptor", "video": "transcriptor/inti illimani - inti illimani ⧸ guitarra - partitura - tablatura.mp4", "frac": 0.85, "passo": 21.4, "rotulo": "C20. transcriptor | transcriptor/inti illimani - inti  | t=0.85 | passo=21.4px"}, {"arq": "C21_transcriptor.png", "canal": "transcriptor", "video": "transcriptor/romance - anonimo - partitura ⧸ tablatura.mp4", "frac": 0.65, "passo": 30.4, "rotulo": "C21. transcriptor | transcriptor/romance - anonimo - p | t=0.65 | passo=30.4px"}, {"arq": "C22_tv on guitar.png", "canal": "tv on guitar", "video": "tv on guitar/athletic theme (from super mario world) guitar tab and standard notation ｜ tvonguitar.mp4", "frac": 0.65, "passo": 14.6, "rotulo": "C22. tv on guitar | tv on guitar/athletic theme (from  | t=0.65 | passo=14.6px"}, {"arq": "C23_tv on guitar.png", "canal": "tv on guitar", "video": "tv on guitar/athletic theme (from super mario world) guitar tab and standard notation ｜ tvonguitar.mp4", "frac": 0.85, "passo": 14.2, "rotulo": "C23. tv on guitar | tv on guitar/athletic theme (from  | t=0.85 | passo=14.2px"}, {"arq": "C24_violaodecria.png", "canal": "violaodecria", "video": "violaodecria/solto - djonga pt hot (coyote beatz) aprenda no violão #tabs #rap #dj... [7553677033939799307].mp4", "frac": 0.65, "passo": 59.2, "rotulo": "C24. violaodecria | violaodecria/solto - djonga pt hot | t=0.65 | passo=59.2px"}, {"arq": "C25_violaodecria.png", "canal": "violaodecria", "video": "violaodecria/solto - djonga pt hot (coyote beatz) aprenda no violão #tabs #rap #dj... [7553677033939799307].mp4", "frac": 0.85, "passo": 59.2, "rotulo": "C25. violaodecria | violaodecria/solto - djonga pt hot | t=0.85 | passo=59.2px"}, {"arq": "C26_ギタロー ⧸ guitarous.png", "canal": "ギタロー ⧸ guitarous", "video": "ギタロー ⧸ guitarous/海の見える街 ソロギター 初心者向け タブ譜.mp4", "frac": 0.65, "passo": 15.4, "rotulo": "C26. ギタロー ⧸ guitarous | ギタロー ⧸ guitarous/海の見える街 ソロギター 初心者向 | t=0.65 | passo=15.4px"}, {"arq": "C27_ギタロー ⧸ guitarous.png", "canal": "ギタロー ⧸ guitarous", "video": "ギタロー ⧸ guitarous/海の見える街 ソロギター 初心者向け タブ譜.mp4", "frac": 0.85, "passo": 15.4, "rotulo": "C27. ギタロー ⧸ guitarous | ギタロー ⧸ guitarous/海の見える街 ソロギター 初心者向 | t=0.85 | passo=15.4px"}];
let atual = 0, escala = 1, marcas = {};   // marcas[arq] = [{x,y,txt}]
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let img = new Image();

function item(){ return ITENS[atual]; }
function minhas(){ return marcas[item().arq] = marcas[item().arq] || []; }

function carrega(){
  img = new Image();
  img.onload = () => { desenha(); };
  img.src = item().arq;
  document.getElementById('rot').textContent = item().rotulo;
  lista();
}
function desenha(){
  cv.width = img.naturalWidth * escala;
  cv.height = img.naturalHeight * escala;
  ctx.drawImage(img, 0, 0, cv.width, cv.height);
  ctx.lineWidth = 1.5; ctx.font = 'bold 13px sans-serif';
  minhas().forEach((m, i) => {
    const x = m.x * escala, y = m.y * escala;
    ctx.strokeStyle = '#ff3b30';
    ctx.beginPath();
    ctx.moveTo(x - 9, y); ctx.lineTo(x + 9, y);
    ctx.moveTo(x, y - 9); ctx.lineTo(x, y + 9);
    ctx.stroke();
    ctx.beginPath(); ctx.arc(x, y, 11, 0, 6.2832); ctx.stroke();
    ctx.fillStyle = '#ff3b30';
    ctx.fillText(String(i + 1), x + 13, y - 11);
  });
}
cv.addEventListener('click', (e) => {
  const r = cv.getBoundingClientRect();
  const x = Math.round((e.clientX - r.left) * (img.naturalWidth / cv.width));
  const y = Math.round((e.clientY - r.top) * (img.naturalHeight / cv.height));
  minhas().push({ x, y, txt: '' });
  desenha(); lista();
});
function lista(){
  const div = document.getElementById('lista');
  div.innerHTML = '';
  minhas().forEach((m, i) => {
    const d = document.createElement('div'); d.className = 'm';
    d.innerHTML = `<b>${i + 1}</b><code>x=${m.x} y=${m.y}</code>`;
    const inp = document.createElement('input');
    inp.placeholder = 'o que é este símbolo? (ex.: ligadura, nota presa, slide, harmônico...)';
    inp.value = m.txt;
    inp.oninput = () => { m.txt = inp.value; };
    const b = document.createElement('button'); b.textContent = 'apagar';
    b.onclick = () => { minhas().splice(i, 1); desenha(); lista(); };
    d.appendChild(inp); d.appendChild(b); div.appendChild(d);
  });
  const total = Object.values(marcas).reduce((s, v) => s + v.length, 0);
  document.getElementById('cont').textContent = `${minhas().length} nesta imagem | ${total} no total`;
}
function va(d){ atual = (atual + d + ITENS.length) % ITENS.length; carrega(); }
function zoom(d){ escala = Math.min(4, Math.max(0.5, escala + d)); document.getElementById('z').textContent = Math.round(escala * 100) + '%'; desenha(); }
function limpar(){ marcas[item().arq] = []; desenha(); lista(); }
function salvar(){
  const saida = { como_usar: 'marcas feitas clicando na imagem; x,y em pixels da imagem original',
                  marcas: [] };
  for (const it of ITENS) {
    for (const m of (marcas[it.arq] || [])) {
      if (m.txt && m.txt.trim()) saida.marcas.push({ imagem: it.arq, rotulo_imagem: it.rotulo, x: m.x, y: m.y, significado: m.txt.trim() });
    }
  }
  const b = new Blob([JSON.stringify(saida, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = 'marcas_simbolos.json';
  a.click();
}
document.getElementById('carregar').addEventListener('change', (ev) => {
  const f = ev.target.files[0]; if (!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const d = JSON.parse(fr.result);
      let n = 0;
      for (const m of (d.marcas || [])) {
        marcas[m.imagem] = marcas[m.imagem] || [];
        marcas[m.imagem].push({ x: m.x, y: m.y, txt: m.significado || '' });
        n++;
      }
      desenha(); lista();
      alert(n + ' marcas anteriores carregadas. Elas somam com as novas.');
    } catch (e) { alert('Nao consegui ler o arquivo: ' + e); }
  };
  fr.readAsText(f);
});
carrega();
</script>
